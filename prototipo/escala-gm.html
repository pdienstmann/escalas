<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Escala GM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra fixa com abas; superfície de trabalho é a grade do serviço (posto × 4 turnos), painel lateral ancorado à direita. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --ink: #17212d; --muted: #5a6778; --line: #d6dce4; --line-strong: #b9c3cf;
  --accent: #1a56b8; --accent-ink: #ffffff; --accent-soft: #e1ebfb; --gold: #c9a227;
  --day: #fbf8f0; --night: #edf0f7; --day-head: #f3e9cf; --night-head: #d9e0ef;
  --he: #9a5a07; --he-bg: #fcefd9; --bh: #6438a8; --bh-bg: #eee5fb; --troca: #0c6b63; --troca-bg: #d9f1ed;
  --furo: #d0121f; --furo-bg: #ffe4e6; --furo-forte: #e0242f; --ok: #1d8a3a; --ok-bg: #e3f6e8; --warn: #c25400; --warn-bg: #fff0dc; --info: #1a56b8; --info-bg: #e1ebfb;
  /* cores da escala em PDF */
  --he-bg: #93c47d; --he-txt: #10260a; --he: #274e13;
  --bh-bg: #f1c232; --bh-txt: #2b2000; --bh: #6b5000;
  --res-bg: #9900ff; --res-txt: #ffffff;
  --rondas-bg: #ffff00; --rondas-txt: #000000;
  --turno-head: #99ccff; --pdf-red: #d40000;
  --c-folga: #cc0000; --c-ferias: #3c78d8; --c-atest: #666666; --c-bhc: #674ea7;
  --paper: #ffffff; --paper-ink: #111111; --paper-line: #8c8c8c; --paper-head: #bcd6f3; --paper-red: #c00000;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-grid: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #161d27; --ink: #e5eaf1; --muted: #95a2b4; --line: #283241; --line-strong: #3a4657;
  --accent: #82b2f2; --accent-ink: #0e131a; --accent-soft: #1b2a3f;
  --day: #1a1a17; --night: #141a25; --day-head: #2c2716; --night-head: #1d2638;
  --he: #b9e29f; --he-bg: #3f6a30; --he-txt: #eef8e8; --bh: #ffe08a; --bh-bg: #7a5f0c; --bh-txt: #fff6d6;
  --res-bg: #6d1fc0; --res-txt: #ffffff; --rondas-bg: #5c5c00; --rondas-txt: #ffffb0; --turno-head: #22405e; --pdf-red: #ff7a7a;
  --c-folga: #ff6b6b; --c-ferias: #7aa7f0; --c-atest: #a0a0a0; --c-bhc: #a98be0; --troca: #63d3c4; --troca-bg: #11302c;
  --furo: #ff7078; --furo-bg: #3d1418; --furo-forte: #c42630; --ok: #7fd086; --ok-bg: #12301b; --warn: #ffab5c; --warn-bg: #3a2610; --info: #82b2f2; --info-bg: #17263b; --gold: #d9b84a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d27; --ink: #e5eaf1; --muted: #95a2b4; --line: #283241; --line-strong: #3a4657;
  --accent: #82b2f2; --accent-ink: #0e131a; --accent-soft: #1b2a3f;
  --day: #1a1a17; --night: #141a25; --day-head: #2c2716; --night-head: #1d2638;
  --he: #b9e29f; --he-bg: #3f6a30; --he-txt: #eef8e8; --bh: #ffe08a; --bh-bg: #7a5f0c; --bh-txt: #fff6d6;
  --res-bg: #6d1fc0; --res-txt: #ffffff; --rondas-bg: #5c5c00; --rondas-txt: #ffffb0; --turno-head: #22405e; --pdf-red: #ff7a7a;
  --c-folga: #ff6b6b; --c-ferias: #7aa7f0; --c-atest: #a0a0a0; --c-bhc: #a98be0; --troca: #63d3c4; --troca-bg: #11302c;
  --furo: #ff8086; --furo-bg: #3a1618; --ok: #7fd086; --warn: #f1b566; --warn-bg: #33270f; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2, h3, h4 { margin: 0; text-wrap: balance; }
small { font-size: .78em; }
.num, .hr, .req { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: .86em; }
.dica { color: var(--muted); font-size: .86em; margin: .25rem 0; }
.eyebrow { margin: 0; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

header.app { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: .55rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; }
.marca { display: flex; align-items: baseline; gap: .5rem; font-family: var(--f-grid); font-weight: 700; letter-spacing: .02em; font-size: 1.05rem; }
.marca span { font: 500 .72rem var(--f-ui); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
nav.abas { display: flex; gap: .25rem; flex-wrap: wrap; flex: 1 1 100%; order: 5; margin-bottom: -.15rem; }
nav.abas a { text-decoration: none; color: var(--muted); padding: .35rem .7rem; border-radius: 6px; font-weight: 500; }
nav.abas a:hover { background: var(--accent-soft); color: var(--ink); }
nav.abas a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.exemplo { font-size: .8rem; color: var(--muted); display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-left: auto; }

main { padding-block: 1rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: .9rem; min-width: 0; }

.barra { display: flex; flex-wrap: wrap; gap: .6rem 1.2rem; align-items: center; justify-content: space-between; }
.datas { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.datas input[type=date] { padding: .35rem .5rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); }
.periodo { margin-left: .4rem; color: var(--muted); }
.periodo b { color: var(--ink); font-family: var(--f-grid); letter-spacing: .02em; }
.titulo-mes { font-family: var(--f-grid); font-size: 1.25rem; min-width: 11ch; text-align: center; }
.equipes { display: flex; gap: .5rem; flex-wrap: wrap; font-size: .85rem; }
.eq { padding: .25rem .6rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.eq b { color: var(--ink); margin-right: .25rem; }
.eq.dia { background: var(--day); } .eq.noite { background: var(--night); }
.ic { width: 2rem; height: 2rem; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 1.15rem; line-height: 1; display: inline-grid; place-items: center; }
.ic:hover { background: var(--accent-soft); }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: .4rem .75rem; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.btn.perigo { background: var(--furo); color: var(--surface); border-color: var(--furo); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font-weight: 500; }
.link:hover { text-decoration: underline; }
.toggle { display: inline-flex; align-items: center; gap: .4rem; font-size: .88rem; color: var(--muted); cursor: pointer; }
.filtros { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.filtros select, .filtros input, .form select, .form input, .form-lanc select, .form-lanc input, .dw-body input, .dw-body select, .sel-gm select {
  padding: .38rem .5rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); min-width: 0; max-width: 100%; }

.resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .6rem; align-items: stretch; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .55rem .8rem; display: grid; }
.kpi .v { font: 600 1.35rem/1.2 var(--f-num); font-variant-numeric: tabular-nums; }
.kpi .v small { color: var(--muted); font-weight: 400; }
.kpi .l { color: var(--muted); font-size: .82rem; }
.kpi.ruim { border-color: var(--furo); background: var(--furo-bg); } .kpi.ruim .v { color: var(--furo); }
.kpi.bom .v { color: var(--ok); }
.kpi.atencao { border-color: var(--warn); background: var(--warn-bg); } .kpi.atencao .v { color: var(--warn); }
.resumo .toggle { align-self: center; }

.alertas { display: grid; gap: .3rem; }
.alertas p { margin: 0; padding: .45rem .7rem; border-radius: 6px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
.alertas p.erro { background: var(--furo-bg); color: var(--furo); border-color: var(--furo); }

.tabela-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
table { border-collapse: collapse; width: 100%; }
table.quadro { min-width: 860px; table-layout: fixed; font-family: var(--f-grid); }
table.quadro col.c-posto { width: 210px; }
table.quadro thead th { position: sticky; top: 0; z-index: 2; font-size: .8rem; letter-spacing: .06em; padding: .45rem .5rem; text-align: left; border-bottom: 1px solid var(--line-strong); background: var(--surface); }
table.quadro thead th.dia, table.quadro thead th.noite { background: var(--turno-head); }
table.quadro thead th small { display: block; font: 400 .72rem var(--f-num); color: var(--muted); letter-spacing: 0; }
table.quadro tr.secao th { text-align: left; font-size: .76rem; letter-spacing: .1em; color: var(--accent); padding: .7rem .6rem .3rem; background: var(--surface); border-bottom: 1px solid var(--line-strong); }
table.quadro td, table.quadro th.posto { border-bottom: 1px solid var(--line); vertical-align: top; padding: .3rem .35rem; }
table.quadro td { border-left: 1px solid var(--line); }
table.quadro td.dia { background: var(--day); } table.quadro td.noite { background: var(--night); }
th.posto { text-align: left; font-weight: 600; font-size: .88rem; }
th.posto .pn { display: block; } th.posto .ps { display: block; font-weight: 600; font-size: .74rem; color: var(--pdf-red); letter-spacing: .02em; }
th.posto .po { display: block; font-weight: 500; font-size: .72rem; color: var(--muted); }
td.fa-cel { background: repeating-linear-gradient(135deg, var(--surface) 0 8px, var(--bg) 8px 16px); color: var(--muted); font-size: .85rem; padding: .55rem .7rem !important; }
.rondas { display: block; font-size: .68rem; font-weight: 700; letter-spacing: .03em; background: var(--rondas-bg); color: var(--rondas-txt); padding: .2rem .35rem; border-radius: 3px; text-align: center; }
.vazio { color: var(--line-strong); padding: .25rem .2rem; display: block; font-size: .8rem; }
.vazio-geral { padding: 1.5rem; text-align: center; color: var(--muted); }

.chip { display: flex; flex-wrap: wrap; align-items: baseline; gap: .1rem .35rem; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 5px; padding: .15rem .3rem; font-family: var(--f-grid); }
button.chip { cursor: pointer; }
.chip:hover { border-color: var(--line-strong); background: var(--surface); }
.chip .nm, .chip .hr, .chip .mais { background: none; border: 0; padding: .05rem .1rem; cursor: pointer; color: inherit; border-radius: 3px; }
.chip button.nm { font-family: var(--f-grid); text-align: left; }
.chip button.hr { font-family: var(--f-num); border-bottom: 1px dotted var(--line-strong); }
.chip button.nm:hover, .chip button.hr:hover { background: var(--accent-soft); color: var(--accent); }
.chip .mais { color: var(--muted); font-weight: 700; margin-left: -.1rem; }
.chip .mais:hover { color: var(--accent); }
.add { display: block; width: 100%; margin-top: .15rem; border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 5px; padding: .15rem .35rem; text-align: left; font: 500 .74rem var(--f-ui); cursor: pointer; opacity: .75; }
.add:hover, .add:focus-visible { opacity: 1; border-color: var(--accent); color: var(--accent); background: var(--surface); }
.chip .nm { font-weight: 600; font-size: .9rem; }
.chip .fn { font: 600 .62rem var(--f-ui); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 .22rem; }
.chip .hr { font-size: .74rem; color: var(--muted); margin-left: auto; }
.chip.he { background: var(--he-bg); color: var(--he-txt); } .chip.bh { background: var(--bh-bg); color: var(--bh-txt); } .chip.troca { background: var(--troca-bg); }
.chip.reserva { background: var(--res-bg); color: var(--res-txt); }
.chip.he .hr, .chip.bh .hr, .chip.reserva .hr, .chip.he .req, .chip.bh .req, .chip.reserva .req { color: inherit; opacity: .85; }
.chip.he .tag, .chip.bh .tag, .chip.reserva .tag { color: inherit; border-color: currentColor; }
.chip.alterado .hr { font-weight: 700; text-decoration: underline dotted; }
.chip .obs { flex-basis: 100%; font: italic .72rem var(--f-ui); color: var(--muted); }
.chip.he .obs, .chip.bh .obs, .chip.reserva .obs { color: inherit; }
.tag.bhc { color: var(--c-bhc); border: 1px solid var(--c-bhc); }
.chip.conflito { outline: 2px solid var(--furo); }
.tag { font: 600 .62rem var(--f-ui); letter-spacing: .04em; padding: .05rem .3rem; border-radius: 3px; white-space: nowrap; }
.tag.he { color: var(--he); border: 1px solid var(--he); } .tag.bh { color: var(--bh); border: 1px solid var(--bh); }
.tag.troca { color: var(--troca); border: 1px solid var(--troca); } .tag.rem { color: var(--accent); border: 1px solid var(--accent); }
.tag.furo { color: var(--furo); border: 1px solid var(--furo); }
.req { font-size: .66rem; color: var(--pdf-red); font-weight: 600; white-space: nowrap; }
.chip .nm { min-width: 0; overflow-wrap: anywhere; } .chip .hr { white-space: nowrap; } .chip .tag, .chip .req { flex: none; }
.furo { display: block; width: 100%; margin-top: .15rem; border: 1px dashed var(--furo); color: var(--furo); background: var(--furo-bg); border-radius: 5px; padding: .3rem .35rem; text-align: left; font: 600 .8rem var(--f-grid); cursor: pointer; }
.furo:hover { border-style: solid; }

.disposicao { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 8px; padding: .6rem .8rem; }
.disposicao h3 { font-size: .95rem; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; } .chips .chip { width: auto; background: var(--surface); border-color: var(--line); }
h3.sub { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: .5rem; }
.n { font: 500 .78rem var(--f-num); color: var(--muted); background: var(--bg); border-radius: 999px; padding: 0 .45rem; margin-left: .25rem; }
.fora { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .6rem; }
.fora-g { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .55rem .75rem; min-width: 0; }
.fora-g h4 { font-size: .85rem; margin-bottom: .3rem; }
.fora-g ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .15rem; font-size: .88rem; }
.fora-g li { display: flex; gap: .4rem; flex-wrap: wrap; align-items: baseline; }

/* painel lateral */
#veu { position: fixed; inset: 0; background: rgba(10, 16, 24, .28); z-index: 40; }
#drawer { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); border-left: 1px solid var(--line-strong);
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: -12px 0 32px rgba(0,0,0,.12); }
.dw-head { display: flex; justify-content: space-between; gap: 1rem; padding: 1rem 1.1rem .7rem; border-bottom: 1px solid var(--line); }
.dw-head h2 { font-family: var(--f-grid); font-size: 1.3rem; }
.dw-body { padding: .8rem 1.1rem 1.5rem; overflow-y: auto; display: grid; gap: .7rem; align-content: start; }
.dw-body h3 { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: .3rem; }
fieldset.horario { border: 1px solid var(--line); border-radius: 8px; padding: .5rem .7rem .6rem; margin: 0; display: grid; gap: .5rem; }
fieldset legend { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 .3rem; }
.opts { display: flex; gap: .4rem; flex-wrap: wrap; }
.opt { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 6px; padding: .3rem .6rem; cursor: pointer; display: grid; text-align: left; font-weight: 500; }
.opt small { font-family: var(--f-num); color: var(--muted); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.linha { display: flex; gap: .5rem; flex-wrap: wrap; }
.linha label, .form label, .form-lanc label { display: grid; gap: .15rem; font-size: .8rem; color: var(--muted); }
.busca input { width: 100%; padding: .45rem .6rem; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); }
ul.sug { list-style: none; margin: 0; padding: 0; display: grid; }
ul.sug li { display: grid; grid-template-columns: 1fr auto auto; gap: .6rem; align-items: center; padding: .5rem 0; border-bottom: 1px solid var(--line); }
ul.sug li[hidden] { display: none; }
.sg { min-width: 0; } .sg b { font-family: var(--f-grid); font-size: .98rem; }
.sh { display: grid; text-align: right; } .sh .num { font-weight: 600; }
.notas { display: flex; gap: .25rem; flex-wrap: wrap; margin-top: .15rem; }
.nota { font-size: .7rem; background: var(--bg); border-radius: 3px; padding: 0 .3rem; color: var(--muted); }
.nota.atencao { background: var(--warn-bg); color: var(--warn); }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; }
.mini div { display: grid; background: var(--bg); border-radius: 6px; padding: .4rem .55rem; }
.mini .num { font-weight: 600; font-size: 1.05rem; }
.acoes { display: flex; flex-wrap: wrap; gap: .4rem; }
.form { display: grid; gap: .5rem; background: var(--bg); border-radius: 8px; padding: .7rem; }
.estado { margin: 0; padding: .35rem .6rem; border-radius: 6px; background: var(--furo-bg); color: var(--furo); font-weight: 500; display: inline-block; }
ul.lista-des, ul.lista-oc { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; }
ul.lista-oc li { display: flex; justify-content: space-between; gap: .5rem; align-items: center; flex-wrap: wrap; font-size: .88rem; }
.tag-linha { margin: .3rem 0 0; }

#toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: .55rem .8rem; border-radius: 8px; display: flex; gap: .8rem; align-items: center; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
#toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 600; cursor: pointer; text-decoration: underline; }

/* lançamentos */
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .9rem 1rem; min-width: 0; display: grid; gap: .6rem; align-content: start; }
.painel h2 { font-size: 1.05rem; } .painel h3 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cols-lanc { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: .9rem; align-items: start; }
.form-lanc { display: grid; grid-template-columns: minmax(0, 1fr); gap: .55rem; min-width: 0; } .form-lanc input, .form-lanc select { box-sizing: border-box; max-width: 100%; }
.cols-lanc.largo { grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); }

.brasoes-aj { align-items: center; } .bras-prev { height: 48px; width: auto; border: 1px solid var(--line); border-radius: 4px; background: #fff; }

<script>
(() => {
// ---- engine.js ----
// Motor da escala — protótipo.
// Princípio: escala do dia = escala ideal (lotação + regime) + ocorrências datadas.
// Nada é copiado para os dias: tudo é calculado. As horas saem do mesmo cálculo.
//
// Tempo: cada "dia de serviço" D vai de D 07:00 até D+1 07:00.
// Horários são minutos a partir de D 00:00 (podem passar de 1440: 01:00 do dia seguinte = 1500).

const TURNOS = [
  { id: "t2", nome: "2º TURNO", ini: 420, fim: 780 },   // 07–13
  { id: "t3", nome: "3º TURNO", ini: 780, fim: 1140 },  // 13–19
  { id: "t4", nome: "4º TURNO", ini: 1140, fim: 1500 }, // 19–01
  { id: "t1", nome: "1º TURNO", ini: 1500, fim: 1860 }, // 01–07
];

const AFASTAMENTOS = {
  FOLGA: "Folga",
  FERIAS: "Férias",
  LICENCA: "Licença",
  ATESTADO: "Atestado",
  CURSO: "Curso",
  FALTA: "Falta",
  BH_COMP: "Banco de horas (compensação)",
};
// Afastamentos de um dia só (valem apenas se o GM estaria de serviço)
const DE_UM_DIA = ["FOLGA", "FALTA", "BH_COMP"];
// textos que versões antigas gravavam sozinhas no remanejamento (não são observação do escalante)
const OBS_AUTO_REMANEJ = new Set(["Remanejado", "Da reserva técnica", "Arrastado no quadro"]);
// O que cada requerimento significa (cadastro de REQ)
const TIPOS_REQ = { BH: "Banco de horas", TROCA: "Troca de serviço", HE: "Hora extra", FOLGA: "Folga", AFAST: "Atestado / licença", FERIAS: "Férias", OUTRO: "Outro" };

const TIPOS = {
  ...AFASTAMENTOS,
  HE: "Hora extra",
  BH_MAIS: "Banco de horas (crédito)",
  TROCA: "Troca de serviço",
  REMANEJ: "Remanejamento",
  FA: "Viatura fora de atividade",
  FECHADO: "Posto fechado",
  PREFIXO: "Viatura substituta",
  VAGAS: "Vagas alteradas no dia",
  INSPETOR: "Inspetor do dia",
  FUNCAO: "Função no dia",
  AREA: "Área / nome no dia",
  DISP_HE: "Disponível para HE",
  DISP_FERIAS: "Declarou férias (folgas)",
  SEM_HE_REC: "HE recorrente suspensa no dia",
  HORARIO: "Horário alterado",
};

// ---------- datas ----------
const DAY = 86400000;
function parseData(s) { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); }
function fmtData(ms) { return new Date(ms).toISOString().slice(0, 10); }
function somaDias(s, n) { return fmtData(parseData(s) + n * DAY); }
function diaSemana(s) { return new Date(parseData(s)).getUTCDay(); } // 0 = domingo
function indiceDia(s) { return Math.round(parseData(s) / DAY); }
function mesDe(s) { return s.slice(0, 7); }
function diasDoMes(mes) {
  const [y, m] = mes.split("-").map(Number);
  const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return Array.from({ length: n }, (_, i) => `${mes}-${String(i + 1).padStart(2, "0")}`);
}
function mesSeguinte(mes) { const [y, m] = mes.split("-").map(Number); return m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, "0")}`; }

// ---------- horários ----------
function hm(str) { const [h, m] = str.split(":").map(Number); return h * 60 + (m || 0); }
function fmtHm(min) { const m = ((min % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`; }
// Converte "19:00"–"01:00" em intervalo contínuo; horários antes das 07:00 contam como madrugada do dia seguinte
// quando o início é à noite (fim <= início).
function intervalo(ini, fim) {
  let a = typeof ini === "number" ? ini : hm(ini);
  let b = typeof fim === "number" ? fim : hm(fim);
  if (a < 420 && b <= 420 && typeof ini === "string" && a < 360) { a += 1440; b += 1440; } // 01:00–07:00 isolado = madrugada
  if (b <= a) b += 1440;
  return [a, b];
}
function sobrepoe(a1, b1, a2, b2) { return Math.max(0, Math.min(b1, b2) - Math.max(a1, a2)); }
function fmtHoras(min) {
  const neg = min < 0; min = Math.abs(Math.round(min));
  const h = Math.floor(min / 60), m = min % 60;
  return (neg ? "−" : "") + (m ? `${h}h${String(m).padStart(2, "0")}` : `${h}h`);
}
// Minutos dentro da janela noturna 22:00–05:00 (informativo para o RH).
function minutosNoturnos(a, b) {
  let t = 0;
  for (let base = -1440; base <= 2880; base += 1440) t += sobrepoe(a, b, base + 1320, base + 1740);
  return t;
}

// ---------- regime ----------
// Lotação com vigência: gm.historico guarda as lotações anteriores com a data em que terminaram,
// assim mudar alguém de posto hoje não reescreve os meses passados.
function vigente(gm, dia) {
  if (!gm.historico?.length) return gm;
  for (const h of [...gm.historico].sort((a, b) => a.ate.localeCompare(b.ate))) if (dia <= h.ate) return { ...gm, equipe: h.equipe, lotacao: h.lotacao, dias: h.dias };
  return gm;
}
function trabalhaNoDia(data, gmAtual, dia) {
  const gm = vigente(gmAtual, dia);
  const eq = data.equipes.find((e) => e.id === gm.equipe);
  if (!eq || gm.ativo === false) return false;
  if (eq.tipo === "alternado") return trabalhaAlternado(data, eq, dia);
  if (eq.tipo === "semanal") return (gm.dias || [1, 2, 3, 4, 5]).includes(diaSemana(dia));
  return false;
}
// Alternância 12x36: basta um dia de referência dizendo quais equipes trabalham nele.
// As equipes listadas trabalham nos dias pares a partir da referência; as demais, nos ímpares.
function trabalhaAlternado(data, eq, dia) {
  const a = data.config?.ancora;
  if (a?.data && a.equipes?.length) {
    const par = (((indiceDia(dia) - indiceDia(a.data)) % 2) + 2) % 2 === 0;
    return a.equipes.includes(eq.id) === par;
  }
  return ((indiceDia(dia) % 2) + 2) % 2 === eq.paridade;
}
function equipesDoDia(data, dia) {
  return data.equipes.filter((e) => e.tipo === "alternado" && trabalhaAlternado(data, e, dia)).map((e) => e.id);
}

// ---------- escala do dia ----------

  for (const gm of data.gms) {

    for (const d of des) {

}
function nomeDoMapa(map, id) { return map.get(id)?.nome || id; }

// Intervalos em que o GM está ocupado no dia D (inclui a noite anterior que avança sobre D).
function ocupacao(data, gmId, dia) {

// ---------- sugestão para cobrir furo ----------
// Ordem de prioridade para HE:
// 0) lotado neste posto e de folga hoje (a escala oposta do posto);
// 1) lotado neste posto e trabalhando hoje no período oposto (pode estender);
// 2) demais, por necessidade: menos HE no mês (contando o que veio do mês anterior);
// quem já passou do teto vai para o fim; reserva técnica / à disposição ficam por último.
// Ordem: 0 escala oposta do mesmo posto e do mesmo turno (dia/noite) · 1 quem já está no posto hoje (estende)

// Horário proposto para um GM numa vaga: EJA a partir do fim do serviço dele; senão, no máximo 6h para quem já trabalha colado.
function horarioProposto(data, dia, gmId, postoId, ini, fim) {

// Quem já trabalha hoje colado ao horário da vaga só estende 6h (um turno): ninguém faz 12h normais + 12h extras.

  if (minhas.some((d) => d.fim <= ini && ini - d.fim < 60)) return [ini, ini + max];

const compararPrioridade = (teto) => (a, b) => {

// Posto de outro cargo (ex.: videomonitoramento, operadores que não são guardas): quem é lotado ali só faz HE ali.

const cargoProprio = (p) => !!p && (p.cargoProprio ?? /VIDEOMONITORAMENTO/i.test(p.nome || ""));
function podeCobrir(data, gm, dia, postoId) {

// Posto existe neste dia? (desativado, extra de um dia só, ou equipe de operação com período)
const postoAtivoEm = (p, dia) => p.ativo !== false && (!p.so || p.so === dia) && (!p.de || p.de <= dia) && (!p.ate || dia <= p.ate);

const secaoOperacao = (data, postoId) => { const p = data.postos.find((x) => x.id === postoId); return p ? (data.secoes || []).find((s) => s.id === p.secao && s.operacao) : null; };
// Duas saídas: remanejar quem está na reserva técnica / à disposição (sem custo) ou chamar HE.
function sugerir(data, dia, postoId, ini, fim) {
  const mes = mesDe(dia);
  const livro = horasParaSugestao(data, mes);
  const cd = calcularDia(data, dia);
  const reserva = new Set(data.postos.filter((p) => p.tipo === "reserva").map((p) => p.id));
  const livreParaRemanejar = (d) => d.nat !== "he" && d.nat !== "bh" && (d.posto === null || reserva.has(d.posto));
  // numa operação dá para puxar gente da própria escala do dia (o posto de origem fica com vaga)
  const op = secaoOperacao(data, postoId);
  const daEscala = (d) => op && d.nat !== "he" && d.nat !== "bh" && d.posto && d.posto !== postoId && !secaoOperacao(data, d.posto);
  const remanejar = [], he = [];
  const afastados = new Set(data.ocorrencias.filter((o) => (["FERIAS", "LICENCA", "ATESTADO", "CURSO"].includes(o.tipo) && ocorrenciaCobre(o, dia)) || (DE_UM_DIA.includes(o.tipo) && o.de === dia)).map((o) => o.gm));
  const ontemNoite = calcularDia(data, somaDias(dia, -1)).designacoes.filter((d) => d.fim - 1440 > ini && d.ini - 1440 < fim).map((d) => d.gm);
  for (const gm of data.gms) {
    if (gm.ativo === false) continue;
    if (afastados.has(gm.id)) continue;
    if (!podeCobrir(data, gm, dia, postoId)) continue;
    const disponivel = data.ocorrencias.some((o) => o.tipo === "DISP_HE" && o.gm === gm.id && o.de === dia);
    const minhas = cd.designacoes.filter((d) => d.gm === gm.id);
    const l = livro.get(gm.id) || { he: 0, transporte: 0 };
    const lotPosto = vigente(gm, dia).lotacao?.posto;
    const base = { gm, heMes: l.he, transporte: l.transporte, mesmoPosto: lotPosto === postoId, noPostoHoje: minhas.some((d) => d.posto === postoId && d.nat !== "he"), mesmoPeriodo: !minhas.length && mesmoPeriodo(data, gm, dia, ini), disponivel };
    const sobre = minhas.filter((d) => sobrepoe(d.ini, d.fim, ini, fim) > 0);
    if (sobre.length) {
      if (sobre.every(livreParaRemanejar)) {
        const d = sobre[0];
        remanejar.push({ ...base, origem: d.posto === null ? "À disposição" : data.postos.find((p) => p.id === d.posto)?.nome, ini: d.ini, fim: d.fim });
      } else if (sobre.every(daEscala)) {
        const d = sobre[0];
        remanejar.push({ ...base, origem: data.postos.find((p) => p.id === d.posto)?.nome, ini: d.ini, fim: d.fim, daEscala: true });

    }
    if (ontemNoite.includes(gm.id)) continue;
    const teto = (data.config?.tetoHE ?? 60) * 60, total = base.heMes + base.transporte;
    const notas = [];
    const eja = horarioEja(data, dia, gm.id, postoId, ini, fim);
    const [ea, eb] = eja || limitarExtensao(data, dia, gm.id, ini, fim);
    if (eja) { base.eja = eja; notas.push(`do dia · estende ${fmtHm(eja[0])}–${fmtHm(eja[1])}`); }
    else if (base.mesmoPosto && !base.noPostoHoje) notas.push(base.mesmoPeriodo ? "escala oposta deste posto" : "deste posto · turno oposto");
    else if (base.mesmoPeriodo) notas.push("de folga · mesmo turno");
    if (base.noPostoHoje) notas.push(eb - ea < fim - ini ? `já está neste posto hoje · estende ${fmtHm(ea)}–${fmtHm(eb)}` : "já está neste posto hoje · estende");
    else if (eb - ea < fim - ini) notas.push(`trabalha hoje · estende ${fmtHm(ea)}–${fmtHm(eb)}`);
    if (disponivel) notas.unshift("se ofereceu para HE");
    if (total >= teto) notas.push("já passou do teto de HE");
    else if (total + (fim - ini) > teto) notas.push("vai passar do teto de HE");

  remanejar.sort((a, b) => (a.daEscala ? 1 : 0) - (b.daEscala ? 1 : 0) || (a.origem === "À disposição" ? 0 : 1) - (b.origem === "À disposição" ? 0 : 1) || a.gm.nome.localeCompare(b.gm.nome));

}

// ---------- livro de horas ----------
function resumoMes(data, mes) {
  conferirVersao(data);
  const chave = mes;

  const r = new Map();
  const get = (id) => { if (!r.has(id)) r.set(id, { servicosBase: 0, servicos: 0, folgas: 0, normal: 0, he: 0, heNoturna: 0, heFixa: 0, bhMais: 0, bhMenos: 0, trocas: 0, afastDias: 0, dias: {} }); return r.get(id); };
  for (const dia of diasDoMes(mes)) {
    const cd = calcularDia(data, dia);
    for (const gm of data.gms) if (trabalhaNoDia(data, gm, dia) && gm.lotacao) get(gm.id).servicosBase++;
    const trabalhouNormal = new Set();
    for (const d of cd.designacoes) {
      const x = get(d.gm), min = d.fim - d.ini;
      const marca = x.dias[dia] || (x.dias[dia] = []);
      if (d.nat === "he") { x.he += min; x.heNoturna += minutosNoturnos(d.ini, d.fim); if (d.fixa) x.heFixa += min; marca.push("HE"); }
      else if (d.nat === "bh") { x.bhMais += min; marca.push("BH+"); }
      else { x.normal += min; x.bhMenos += d.bhDebito || 0; trabalhouNormal.add(d.gm); if (d.nat === "troca") marca.push("TR"); else marca.push("S"); }
    }
    for (const id of trabalhouNormal) get(id).servicos++;
    for (const a of cd.afastados) {
      const x = get(a.gm);
      (x.dias[dia] || (x.dias[dia] = [])).push(a.tipo);
      if (a.tipo === "FOLGA") x.folgas++;
      else if (a.tipo === "BH_COMP") x.bhMenos += a.minutos;
      else if (a.tipo === "TROCA") x.trocas++;
      else x.afastDias++;
    }
    // afastamentos longos em dias sem serviço
    for (const o of data.ocorrencias) if (["FERIAS", "LICENCA", "ATESTADO", "CURSO"].includes(o.tipo) && ocorrenciaCobre(o, dia)) {
      const x = get(o.gm); const m = x.dias[dia] || (x.dias[dia] = []);
      if (!m.includes(o.tipo)) m.push(o.tipo);
    }
  }
  cacheMes.set(chave, r);
  return r;
}

// Saldo de HE com teto de pagamento: o que passa do teto vai para o mês seguinte.
function livroMes(data, mes) {
  const teto = (data.config?.tetoHE ?? 60) * 60;
  let mesAtual = data.config?.mesInicial || mes;
  if (mes < mesAtual) mesAtual = mes;
  const transporte = new Map(Object.entries(data.config?.transporteInicial || {}).map(([k, v]) => [k, v * 60]));
  let livro;
  for (let guarda = 0; guarda < 240; guarda++) {
    const r = resumoMes(data, mesAtual);
    livro = new Map();
    for (const gm of data.gms) {
      const x = r.get(gm.id) || { he: 0, bhMais: 0, bhMenos: 0 };
      const anterior = transporte.get(gm.id) || 0;
      const total = anterior + x.he;
      const paga = Math.min(teto, total);
      livro.set(gm.id, { ...x, transporte: anterior, total, paga, proximo: total - paga });
    }
    if (mesAtual >= mes) break;
    for (const [id, l] of livro) transporte.set(id, l.proximo);
    mesAtual = mesSeguinte(mesAtual);
  }
  return livro;
}

// ---------- controle de horas extras ----------
// A escala calcula a HE prevista; o controle só recebe o que foi confirmado ao finalizar a escala do dia,
// e cada lançamento pode ser corrigido depois (o RH é quem sabe se o GM compareceu).
// data.controle: { id, tipo: "FECHADO", dia, quando } e { id, tipo: "HE", dia, gm, min, posto, ini, fim, fixa, manual, obs }
const diaFinalizado = (data, dia) => (data.controle || []).some((c) => c.tipo === "FECHADO" && c.dia === dia);
// HE do dia como vai para o controle (uma linha por trecho de HE)
function heDoDia(data, dia) {
  return calcularDia(data, dia).designacoes.filter((d) => d.nat === "he" && d.gm).map((d) => ({
    id: `h${dia.replaceAll("-", "")}${d.id}`, tipo: "HE", dia, gm: d.gm, min: d.fim - d.ini, posto: d.posto, ini: fmtHm(d.ini), fim: fmtHm(d.fim),
    fixa: !!(d.fixa || d.recorrente), req: d.fixa ? "" : d.req || "",
  }));
}
// Dias do mês até `ate` que ainda não foram finalizados
function diasEmAberto(data, mes, ate) {
  return diasDoMes(mes).filter((d) => d <= ate && !diaFinalizado(data, d));
}
// HE confirmada no controle, com o teto e o que passa para o mês seguinte (mesma regra de livroMes)
function controleMes(data, mes) {
  const teto = (data.config?.tetoHE ?? 60) * 60, ctl = (data.controle || []).filter((c) => c.tipo === "HE");
  // valores digitados à mão no mês (o controle é só uma referência; o RH é quem fecha)
  const fixo = (tipo, mes, gm) => (data.controle || []).find((c) => c.tipo === tipo && c.mes === mes && c.gm === gm);
  let m = data.config?.mesInicial || mes;
  if (mes < m) m = mes;
  const transporte = new Map(Object.entries(data.config?.transporteInicial || {}).map(([k, v]) => [k, v * 60]));
  let livro;
  for (let guarda = 0; guarda < 240; guarda++) {
    const he = new Map(), fixa = new Map();
    for (const c of ctl) if (c.dia.startsWith(m)) { he.set(c.gm, (he.get(c.gm) || 0) + Number(c.min || 0)); if (c.fixa) fixa.set(c.gm, (fixa.get(c.gm) || 0) + Number(c.min || 0)); }
    livro = new Map();
    for (const gm of data.gms) {
      const ft = fixo("TRANSPORTE", m, gm.id), fp = fixo("PAGA", m, gm.id);
      const anterior = ft ? Number(ft.min) : transporte.get(gm.id) || 0, x = he.get(gm.id) || 0, total = anterior + x;
      const paga = fp ? Math.max(0, Number(fp.min)) : Math.max(0, Math.min(teto, total));
      livro.set(gm.id, { he: x, heFixa: fixa.get(gm.id) || 0, transporte: anterior, total, paga, proximo: Math.max(0, total - paga), manual: { transporte: !!ft, paga: !!fp } });
    }
    if (m >= mes) break;
    for (const [id, l] of livro) transporte.set(id, l.proximo);
    m = mesSeguinte(m);
  }
  return livro;
}
// Horas para escolher quem chamar: o que já está no controle (com as correções) + o previsto nos dias em aberto
const cacheSug = new WeakMap();
function horasParaSugestao(data, mes) {
  const chave = `${data._versao}|${mes}`, c0 = cacheSug.get(data);
  if (c0?.chave === chave) return c0.r;
  const r0 = horasSugestaoCalc(data, mes); cacheSug.set(data, { chave, r: r0 }); return r0;
}
function horasSugestaoCalc(data, mes) {
  const ctl = controleMes(data, mes), prev = previstaMes(data, mes), r = new Map();
  for (const g of data.gms) { const c = ctl.get(g.id) || {}; r.set(g.id, { he: (c.he || 0) + (prev.get(g.id) || 0), transporte: c.transporte || 0 }); }
  return r;
}
// HE prevista pela escala nos dias do mês que ainda não foram finalizados
function previstaMes(data, mes) {
  const r = new Map();
  for (const d of diasDoMes(mes)) if (!diaFinalizado(data, d)) for (const h of heDoDia(data, d)) r.set(h.gm, (r.get(h.gm) || 0) + h.min);
  return r;
}

// Saldo acumulado de banco de horas até o fim do mês.
function saldoBH(data, gmId, mes) {
  let m = data.config?.mesInicial || mes, s = 0;
  if (mes < m) m = mes;
  for (let i = 0; i < 240; i++) {
    const x = resumoMes(data, m).get(gmId);
    if (x) s += x.bhMais - x.bhMenos;
    if (m >= mes) break;
    m = mesSeguinte(m);
  }
  return s;
}

// ---------- pendências e preenchimento automático ----------
const PERIODOS_P = [["dia", ["t2", "t3"]], ["noite", ["t4", "t1"]]];
function pendencias(data, dia) {
  const cd = calcularDia(data, dia);
  const out = [];
  for (const p of data.postos) for (const [per, ts] of PERIODOS_P) {
    const fs = cd.furos.filter((f) => f.posto === p.id && ts.includes(f.turno));
    if (!fs.length) continue;
    const t0 = TURNOS.find((x) => x.id === fs[0].turno), t1 = TURNOS.find((x) => x.id === fs[fs.length - 1].turno);
    // posto de reforço (ex.: EJA 19–23) cobre só o horário do reforço
    const [ri, rf] = p.reforco ? intervalo(p.reforco.ini, p.reforco.fim) : [t0.ini, t1.fim];
    out.push({ dia, posto: p.id, per, turnos: fs.map((f) => f.turno), faltam: Math.max(...fs.map((f) => f.faltam)), ini: ri, fim: rf });
  }
  return out;
}

// Propõe como cobrir todos os furos dos dias informados, sem gravar nada:
// 1º quem está na reserva técnica / à disposição (remanejar), 2º HE para quem conhece o posto e tem menos horas no mês.
function planejarCobertura(data, dias) {
  const plano = [];
  const heExtra = new Map();
  const reserva = new Set(data.postos.filter((p) => p.tipo === "reserva").map((p) => p.id));
  for (const dia of dias) {
    const cd = calcularDia(data, dia);
    const livro = horasParaSugestao(data, mesDe(dia));
    const afast = new Set(data.ocorrencias.filter((o) => (["FERIAS", "LICENCA", "ATESTADO", "CURSO"].includes(o.tipo) && ocorrenciaCobre(o, dia)) || (DE_UM_DIA.includes(o.tipo) && o.de === dia)).map((o) => o.gm));
    const ocup = new Map();
    const marca = (g, a, b) => { if (!ocup.has(g)) ocup.set(g, []); ocup.get(g).push([a, b]); };
    for (const d of cd.designacoes) marca(d.gm, d.ini, d.fim);
    for (const d of calcularDia(data, somaDias(dia, -1)).designacoes) if (d.fim > 1440) marca(d.gm, d.ini - 1440, d.fim - 1440);
    const livres = cd.designacoes.filter((d) => d.nat === "normal" && (d.posto === null || reserva.has(d.posto)));
    const usados = new Set();
    const teto = (data.config?.tetoHE ?? 60) * 60;
    for (const pend of pendencias(data, dia)) for (let k = 0; k < pend.faltam; k++) {
      const fila = [[pend.ini, pend.fim]];
      while (fila.length) {
      const [ini, fim] = fila.shift(), p = { ...pend, ini, fim };
      const mes = mesDe(dia);
      let melhor = null;
      for (const gm of data.gms) {
        if (gm.ativo === false || gm.naoFazHE || afast.has(gm.id) || !podeCobrir(data, gm, dia, p.posto)) continue;
        if ((ocup.get(gm.id) || []).some(([a, b]) => sobrepoe(a, b, p.ini, p.fim) > 0)) continue;
        const l = livro.get(gm.id) || { he: 0, transporte: 0 };
        const x = { gm, heMes: l.he + (heExtra.get(gm.id + mes) || 0), transporte: l.transporte, mesmoPosto: vigente(gm, dia).lotacao?.posto === p.posto,
          noPostoHoje: cd.designacoes.some((d) => d.gm === gm.id && d.posto === p.posto && d.nat !== "he"), bloqueado: false,
          mesmoPeriodo: !cd.designacoes.some((d) => d.gm === gm.id) && mesmoPeriodo(data, gm, dia, p.ini), eja: !!horarioEja(data, dia, gm.id, p.posto, p.ini, p.fim),
          disponivel: data.ocorrencias.some((o) => o.tipo === "DISP_HE" && o.gm === gm.id && o.de === dia) };
        if (!melhor || compararPrioridade(teto)(x, melhor) < 0) melhor = x;
      }
      // reserva técnica / à disposição só se ninguém puder fazer HE
      const rv = !melhor && livres.find((d) => !usados.has(d.gm) && sobrepoe(d.ini, d.fim, p.ini, p.fim) >= Math.min(360, p.fim - p.ini));
      if (rv) {
        usados.add(rv.gm);
        plano.push({ dia, posto: p.posto, tipo: "REMANEJ", gm: rv.gm, ini: rv.ini, fim: rv.fim, de: rv.posto === null ? "à disposição" : "reserva técnica" });
        continue;
      }
      if (!melhor) { plano.push({ dia, posto: p.posto, tipo: null, ini: p.ini, fim: p.fim }); continue; }
      // quem já trabalha colado só estende 6h; o resto da vaga vai para outro GM
      const ej = horarioEja(data, dia, melhor.gm.id, p.posto, p.ini, p.fim);
      const [ea, eb] = ej || limitarExtensao(data, dia, melhor.gm.id, p.ini, p.fim);
      if (!ej) { if (ea > p.ini) fila.push([p.ini, ea]); if (eb < p.fim) fila.push([eb, p.fim]); }
      melhor.horas = melhor.heMes + melhor.transporte; melhor.mesmo = melhor.mesmoPosto;
      marca(melhor.gm.id, ea, eb);
      heExtra.set(melhor.gm.id + mes, (heExtra.get(melhor.gm.id + mes) || 0) + eb - ea);
      plano.push({ dia, posto: p.posto, tipo: "HE", gm: melhor.gm.id, ini: ea, fim: eb, horasNoMes: melhor.horas, conhecePosto: !!melhor.mesmo });
      }
    }
  }
  return plano;
}

// Monta o horário fixo a partir de faixas ("07-12 13-19") e das horas de HE fixa por dia:
// as últimas N horas viram hora extra fixa, como no padrão impresso ("13:00/19:00 3HE").
function montarSegmentos(faixas, heMin = 0) {
  let partes = faixas.map(([i, f]) => intervalo(i, f)).sort((x, y) => x[0] - y[0]);
  if (partes.length && partes[0][0] < 420 && partes.some(([a]) => a >= 900)) partes = partes.map(([a, b]) => (a < 420 ? [a + 1440, b + 1440] : [a, b])).sort((x, y) => x[0] - y[0]);
  const unidos = [];
  for (const [a, b] of partes) { if (unidos.length && a <= unidos.at(-1)[1]) unidos.at(-1)[1] = Math.max(b, unidos.at(-1)[1]); else unidos.push([a, b]); }
  const segs = unidos.map(([a, b]) => ({ a, b, tipo: "normal" }));
  let resto = heMin;
  for (let i = segs.length - 1; i >= 0 && resto > 0; i--) {
    const s = segs[i], dur = s.b - s.a;
    if (dur <= resto) { s.tipo = "he"; resto -= dur; }
    else { segs.splice(i + 1, 0, { a: s.b - resto, b: s.b, tipo: "he" }); s.b -= resto; resto = 0; }
  }
  return segs.map((s) => ({ ini: fmtHm(s.a), fim: fmtHm(s.b), tipo: s.tipo }));
}
// "07-12 13-19" ou "7h às 12h e 13h às 19h" → [["07:00","12:00"],["13:00","19:00"]]
function lerFaixas(txt) {
  const nums = [...String(txt).matchAll(/(\d{1,2})(?:[:hH.]?(\d{2}))?/g)].map(([, h, m]) => (Number(h) > 24 || Number(m || 0) > 59 ? null : `${String(Number(h) % 24).padStart(2, "0")}:${m || "00"}`));
  if (nums.length < 2 || nums.length % 2 || nums.includes(null)) return null;
  const out = [];
  for (let i = 0; i < nums.length; i += 2) { if (nums[i] === nums[i + 1]) return null; out.push([nums[i], nums[i + 1]]); }
  return out;
}
// Descreve o horário fixo de volta: { faixas: "07:00-12:00 13:00-19:00", heMin: 180 }
function descreverSegmentos(segs) {
  const parts = segs.map((s) => intervalo(s.ini, s.fim)).sort((x, y) => x[0] - y[0]);
  const heMin = segs.filter((s) => s.tipo === "he").reduce((t, s) => { const [a, b] = intervalo(s.ini, s.fim); return t + b - a; }, 0);
  const unidos = [];
  for (const [a, b] of parts) { if (unidos.length && a === unidos.at(-1)[1]) unidos.at(-1)[1] = b; else unidos.push([a, b]); }
  return { faixas: unidos.map(([a, b]) => `${fmtHm(a)}-${fmtHm(b)}`).join(" "), heMin };
}

}

// ---- comando.js ----
// Lançamento rápido por texto: "folga kraemer 28/11", "ferias lang 1/12 a 30/12",
// "he couto hoje 19-01 vtr 1317 req 1504", "troca castro por lang 29/11", "fa vtr 1281 26/11 a 30/11".

const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

const PALAVRAS = [
  [/\bbh\s*\+|\bcredito\b/, "BH_MAIS"],
  [/\bcompensa\w*|\bbh\s*-|\bbh\b/, "BH_COMP"],
  [/\bhe\b|\bhora extra\b|\bextra\b/, "HE"],
  [/\bfolga\b/, "FOLGA"],
  [/\bferias\b/, "FERIAS"],
  [/\blicenca\b/, "LICENCA"],
  [/\batestado\b/, "ATESTADO"],
  [/\bcurso\b/, "CURSO"],
  [/\btroca\b/, "TROCA"],
  [/\bremaneja\w*/, "REMANEJ"],
  [/\bfa\b|\bfora de atividade\b|\bbaixada\b/, "FA"],
];
const PRECISA_POSTO = ["HE", "BH_MAIS", "REMANEJ", "FA"];
const PERIODO = ["FERIAS", "LICENCA", "ATESTADO", "CURSO", "REMANEJ", "FA"];
const VAZIAS = new Set(["de", "da", "do", "das", "dos", "no", "na", "em", "para", "pra", "por", "com", "o", "a", "e", "vtr", "posto", "ate", "as", "hoje", "amanha", "ontem", "noite", "dia", "turno"]);

function interpretar(texto, data, hoje) {
  let t = " " + norm(texto).replace(/\s+/g, " ") + " ";
  const r = { faltando: [] };

  // REQ
  const mReq = t.match(/\breq\.?\s*([\w/-]+)/);
  if (mReq) { r.req = mReq[1].toUpperCase(); t = t.replace(mReq[0], " "); }

  // tipo
  for (const [re, tipo] of PALAVRAS) { const m = t.match(re); if (m) { r.tipo = tipo; t = t.replace(m[0], " "); break; } }

  // datas
  const datas = [];
  const ano = Number(hoje.slice(0, 4)), mesHoje = Number(hoje.slice(5, 7));
  t = t.replace(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g, (_, d, m, a) => {
    let y = a ? Number(a.length === 2 ? "20" + a : a) : ano;
    if (!a && Number(m) < mesHoje - 6) y++;
    if (!a && Number(m) > mesHoje + 6) y--;
    datas.push(`${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
    return " ";
  });
  t = t.replace(/\b(hoje|amanha|ontem)\b/g, (w) => { datas.push(somaDias(hoje, { hoje: 0, amanha: 1, ontem: -1 }[w])); return " "; });

  // horário
  const mH = t.match(/\b(\d{1,2})(?:[:h](\d{2}))?h?\s*(?:-|–|as|ate|a)\s*(\d{1,2})(?:[:h](\d{2}))?h?\b/);
  if (mH && Number(mH[1]) <= 24 && Number(mH[3]) <= 24) {
    const f = (h, m) => `${String(Number(h) % 24).padStart(2, "0")}:${m || "00"}`;
    r.ini = f(mH[1], mH[2]); r.fim = f(mH[3], mH[4]);
    t = t.replace(mH[0], " ");
  }

  // GMs (nome inteiro; depois prefixo com 4+ letras)
  const achados = [];
  const nomes = [...data.gms].sort((a, b) => b.nome.length - a.nome.length);
  for (const g of nomes) {
    const re = new RegExp(`(^|\\s)${escRe(norm(g.nome))}(?=\\s|$)`);
    const m = t.match(re);
    if (m) { achados.push({ g, pos: m.index }); t = t.slice(0, m.index) + " ".repeat(m[0].length) + t.slice(m.index + m[0].length); }
  }
  if (!achados.length || (r.tipo === "TROCA" && achados.length < 2)) {
    for (const w of t.split(" ").filter((x) => x.length >= 4 && /^[a-z]+$/.test(x) && !VAZIAS.has(x))) {
      const c = data.gms.filter((g) => norm(g.nome).split(" ").some((p) => p.startsWith(w)));
      if (c.length === 1 && !achados.some((a) => a.g === c[0])) { achados.push({ g: c[0], pos: t.indexOf(w) }); t = t.replace(w, " "); }
      else if (c.length > 1) r.ambiguo = { termo: w, opcoes: c.slice(0, 5).map((g) => g.nome) };
    }
  }
  achados.sort((a, b) => a.pos - b.pos);
  if (achados[0]) r.gm = achados[0].g.id;
  if (r.tipo === "TROCA" && achados[1]) r.substituto = achados[1].g.id;

  // posto
  const resto = t.split(" ").filter((w) => w && !VAZIAS.has(w));
  if (resto.length) {
    const noturno = r.ini ? (hm(r.ini) >= 19 * 60 || hm(r.ini) < 7 * 60) : null;
    let melhor = null;
    for (const p of data.postos) {
      const palavras = new Set(norm(`${p.nome} ${p.sub || ""}`).split(/[^a-z0-9]+/).filter(Boolean));
      let s = 0;
      for (const w of resto) if (palavras.has(w)) s += /^\d+$/.test(w) ? 3 : 1;
      if (!s) continue;
      const ehNoite = /noite/.test(norm(p.nome));
      if (noturno !== null && ehNoite === noturno) s += 0.5;
      if (!melhor || s > melhor.s) melhor = { p, s };
    }
    if (melhor) r.posto = melhor.p.id;
  }

  // datas e padrões
  if (datas[0]) r.de = datas[0];
  if (datas[1]) r.ate = datas[1];
  if (!r.de) { r.de = hoje; r.dataPresumida = true; }
  if (PERIODO.includes(r.tipo) && !r.ate) r.ate = r.de;

  if (!r.tipo) r.faltando.push("tipo");
  if (r.tipo !== "FA" && !r.gm) r.faltando.push("GM");
  if (r.tipo === "TROCA" && !r.substituto) r.faltando.push("substituto");
  if (PRECISA_POSTO.includes(r.tipo) && !r.posto) r.faltando.push(r.tipo === "FA" ? "viatura" : "posto");
  if ((r.tipo === "HE" || r.tipo === "BH_MAIS") && !r.ini) r.faltando.push("horário");
  if (r.ate && r.ate < r.de) r.faltando.push("data final depois da inicial");
  r.completo = !r.faltando.length;
  return r;
}

const cachePartes = new WeakMap();
function partesVisuais(d) {
  if (cachePartes.has(d)) return cachePartes.get(d);

    t ||= a < TURNOS[0].ini ? TURNOS[0] : TURNOS[3];

    if (ja) ja.fim = b; else partes.push({ t, ini: a, fim: b });

  cachePartes.set(d, partes);
  return partes;
}
const naColuna = (d, t) => partesVisuais(d).some((p) => p.t === t);

  const pt = partesVisuais(d).find((p) => p.t === t);

}
function chip(d, t, junto) {

function salvarCelHoras(el) {

      if (delta) data.controle.push({ id: aj?.id || novoId(), tipo: "HE", manual: true, ajusteMes: m, dia: `${m}-01`, gm, min: delta, obs: "ajuste do total no Mês e horas", editado: true });
    });

// "6", "6h", "6:30", "6,5", "-6" → minutos
function lerHoras(txt) {
  const t = String(txt || "").trim().replace(/h$/i, "").replace(",", ".");

// Escolha de folgas: no mês anterior (mais ou menos de 15 a 25) os GMs mudam à vontade; depois, só por solicitação.

  const cel = (l) => (l.match(/("([^"]|"")*"|[^;]*)(;|$)/g) || []).map((c) => c.replace(/;$/, "").replace(/^"|"$/g, "").replace(/""/g, '"').replace(/^'/, "").trim()).slice(0, -1).concat([]);
  const cab = cel(linhas[0]).map((c) => norm(c));
  const col = (nome) => cab.findIndex((c) => c.includes(norm(nome)));
  const iN = col("nome"), iF = cab.map((c, i) => (c.startsWith("folga") ? i : -1)).filter((i) => i >= 0), iFe = col("ferias"), iHe = col("hora extra"), iP = col("protocolo");
  if (iN < 0) return null;
  const achar = acharGmPorNome;
  const iso = (v) => { const t = String(v || "").trim(); if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t; const b = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return b ? `${b[3]}-${b[2].padStart(2, "0")}-${b[1].padStart(2, "0")}` : ""; };
  return { linhas: linhas.slice(1).map((l) => { const c = cel(l), g = achar(c[iN] || "");
    return { nome: c[iN] || "", gm: g?.id || "", folgas: iF.map((i) => iso(c[i])).filter(Boolean), ferias: iFe >= 0 && /^sim$/i.test(c[iFe] || ""), he: iHe >= 0 ? (c[iHe] || "").split(/[,\s]+/).map(iso).filter(Boolean) : [], protocolo: iP >= 0 ? c[iP] || "" : "" }; }).filter((x) => x.nome) };
}

function celulaDia(marcas) {
  if (!marcas || !marcas.length) return `<td class="d"></td>`;
  const prim = marcas.find((m) => m !== "HE" && m !== "BH+");
  const [txt, cls] = prim ? COD[prim] : ["", ""];
  const he = marcas.includes("HE"), bh = marcas.includes("BH+");

}

// ---------- FOLHA (impressão) ----------
function vFolha() {
  const cd = calcularDia(data, ui.dia);
  const amanha = somaDias(ui.dia, 1);
  const eqs = cd.equipes.map(equipe);
  const insp = (per) => eqs.filter((e) => e.periodo === per).map((e) => (cd.inspetores.has(e.id) ? cd.inspetores.get(e.id) : e.inspetor)).filter(Boolean).join(", ");
  const faPostos = new Map(cd.fa.map((o) => [o.posto, o]));
  const cel = (p, t) => {
    if (faPostos.has(p.id)) return `<td colspan="2" class="c">${faPostos.get(p.id).tipo === "FA" ? "FA" : "FECHADO"}</td>`;
    const todos = cd.designacoes.filter((d) => d.posto === p.id && naColuna(d, t)).sort((a, b) => a.ini - b.ini);
    const { mostrar: aqui, junto } = juntarHeFixa(todos, t, cd.designacoes);
    if (!aqui.length) {
      if (p.rondas) return `<td colspan="2" class="c rondas-p">VTR/RONDAS FREQUENTES</td>`;
      if (cd.furos.some((f) => f.posto === p.id && f.turno === t.id)) return `<td colspan="2" class="c furo-p">X</td>`;
      return `<td></td><td></td>`;
    }
    const fixaSo = (d) => d.fixa && !d.recorrente ? "" : d.nat;
    return `<td class="gn">${aqui.map((d) => `<div class="${fixaSo(d)} ${p.tipo === "reserva" ? "reserva" : ""}">${funcaoFolha(d)}${esc(nomeGm(d.gm))}${d.nat === "he" ? (d.fixa ? "" : " HE+") : d.nat === "bh" ? " BH+" : ""}${d.req && !d.fixa ? `<span class="r req-l">REQ ${esc(d.req)}</span>` : ""}</div>`).join("")}</td>
      <td class="gh">${aqui.map((d) => { const j = junto.get(d); const hr = j ? `${textoCelula(d, t).split("/")[0]}/${fmtHm(j.he.fim)}` : textoCelula(d, t);
        return `<div class="${fixaSo(d)}">(${hr})${j ? ` <span class="r he-n">${fmtHE(j.total)}</span>` : d.recorrente ? ` <span class="r he-n">HE+</span>` : d.fixa ? ` <span class="r he-n">${fmtHE(d.fim - d.ini)}</span>` : ""}</div>`; }).join("")}</td>`;
  };
  let corpo = "", corpoVerso = "";
  for (const s of data.secoes) {
    if (!opNoDia(s, ui.dia)) continue;
    const ps = data.postos.filter((p) => p.secao === s.id && postoDoDia(p, ui.dia) && faPostos.get(p.id)?.tipo !== "FA" // viatura em FA não sai na folha
      && (p.rondas || faPostos.has(p.id) || cd.designacoes.some((d) => d.posto === p.id) || cd.furos.some((f) => f.posto === p.id))); // nem posto vazio sem vaga
    if (!ps.length) continue;
    const verso = ps.every((p) => p.tipo === "reserva");
    if (s.grupamento && !cd.designacoes.some((d) => ps.some((p) => p.id === d.posto))) continue;

// ---------- LANÇAMENTO RÁPIDO ----------
const EXEMPLOS = ["folga {A} 28/11", "férias {A} 1/12 a 30/12 req 1402", "he {A} hoje 19-01 vtr 1317 req 1504", "troca {A} por {B} 29/11", "remanejar {A} parcão amanhã", "fa vtr 1281 26/11 a 30/11"];
function previaComando(txt) {
  const box = $("#cmd-prev");
  if (!box) return;
  if (!txt.trim()) {
    const [A, B] = [data.gms[5]?.nome || "", data.gms[60]?.nome || ""];
    box.innerHTML = `<p class="dica">Escreva como falaria. Exemplos (clique para usar):</p><div class="exs">${EXEMPLOS.map((e) => { const x = e.replace("{A}", A.toLowerCase()).replace("{B}", B.toLowerCase()); return `<button class="ex" data-act="cmd-ex" data-txt="${esc(x)}">${esc(x)}</button>`; }).join("")}</div>`;
    return;
  }
  const r = interpretar(txt, data, ui.dia);
  const campo = (rot, val, ok = true) => `<span class="cp ${ok ? "" : "falta"}"><small>${rot}</small>${val}</span>`;
  const partes = [campo("Tipo", r.tipo ? esc(TIPOS[r.tipo]) : "?", !!r.tipo)];
  if (r.tipo !== "FA") partes.push(campo("GM", r.gm ? esc(nomeGm(r.gm)) : "?", !!r.gm));
  if (r.tipo === "TROCA") partes.push(campo("Quem assume", r.substituto ? esc(nomeGm(r.substituto)) : "?", !!r.substituto));
  partes.push(campo(r.ate && r.ate !== r.de ? "Período" : "Data", `${SEMANA[diaSemana(r.de)].slice(0, 3).toLowerCase()} ${ddmm(r.de)}${r.ate && r.ate !== r.de ? ` a ${ddmm(r.ate)}` : ""}${r.dataPresumida ? " (dia aberto)" : ""}`));
  if (r.ini || r.tipo === "HE" || r.tipo === "BH_MAIS") partes.push(campo("Horário", r.ini ? `${r.ini}–${r.fim}` : "?", !!r.ini));
  if (r.posto || ["HE", "BH_MAIS", "REMANEJ", "FA"].includes(r.tipo)) partes.push(campo(r.tipo === "FA" ? "Viatura" : "Posto", r.posto ? esc(postoPorId(r.posto).nome) : "?", !!r.posto));
  if (r.req) partes.push(campo("REQ", esc(r.req)));
  box.innerHTML = `<div class="cps">${partes.join("")}</div>
    ${r.ambiguo ? `<p class="dica">"${esc(r.ambiguo.termo)}" pode ser: ${r.ambiguo.opcoes.map(esc).join(", ")}</p>` : ""}
    ${r.completo ? `<p class="ok-linha"><button class="btn pri" data-act="cmd-lancar">Lançar</button> <span class="dica">ou tecle Enter</span></p>` : `<p class="dica falta-txt">Falta: ${r.faltando.join(", ")}</p>`}`;
}
function lancarComando() {
  const inp = $("#cmd");
  const r = interpretar(inp.value, data, ui.dia);
  if (!r.completo) { previaComando(inp.value); return; }
  const o = { id: novoId(), tipo: r.tipo, de: r.de };
  for (const k of ["gm", "substituto", "ate", "ini", "fim", "posto", "req"]) if (r[k]) o[k] = r[k];
  mudar(`Lançado: ${TIPOS[r.tipo]}${o.gm ? " · " + nomeGm(o.gm) : ""} · ${ddmm(o.de)}${o.ate && o.ate !== o.de ? " a " + ddmm(o.ate) : ""}`, () => data.ocorrencias.push(o));
  inp.value = ""; previaComando("");
}

// ---------- PREENCHER SOZINHO ----------

        : `<span class="meta">ninguém disponível — resolver à mão</span>`}</label></li>`).join("")}</ul>`).join("")}</div>
    <div class="plano-acoes"><button class="btn pri grande" data-act="plano-aplicar">Confirmar ${ok.length} ${ok.length === 1 ? "lançamento" : "lançamentos"}</button><button class="btn" data-act="plano-cancelar">Cancelar</button></div></section>`;

// ---------- EDIÇÃO NA PRÓPRIA CÉLULA ----------
const PRESETS = {
  dia: [["07:00", "13:00"], ["13:00", "19:00"], ["07:00", "19:00"], ["07:00", "21:00"], ["13:00", "01:00"]],
  noite: [["19:00", "01:00"], ["01:00", "07:00"], ["19:00", "07:00"], ["17:00", "07:00"]],
};
const periodoDe = (ini) => (ini >= 1140 || ini < 420 ? "noite" : "dia");
function abrirPop(modo, el, extra) {
  const r = el.getBoundingClientRect();
  ui.pop = { modo, anc: { x: r.left + scrollX, y: r.top + scrollY, w: r.width, h: r.height }, turno: el.closest?.("td[data-turno]")?.dataset.turno, ...extra };
  desenharPop();
}
// A caixinha acompanha a rolagem da página, ancorada no ponto clicado.
function posicionarPop() {
  const p = $("#pop"), s = ui.pop;
  if (!s || p.hidden) return;
  if (innerWidth < 600) { p.classList.add("embaixo"); p.style.left = ""; p.style.top = ""; return; }
  p.classList.remove("embaixo");
  const W = p.offsetWidth, h = p.offsetHeight;
  const ax = s.anc.x - scrollX, ay = s.anc.y - scrollY;
  const x = Math.min(Math.max(12, ax), innerWidth - W - 12);
  let y = ay + s.anc.h + 6;
  if (y + h > innerHeight - 12) y = Math.max(12, ay - h - 6);
  p.style.left = x + "px"; p.style.top = y + "px";
}
function fecharPop() { ui.pop = null; const p = $("#pop"); if (p) { p.hidden = true; p.innerHTML = ""; } }
function desenharPop() {
  const p = $("#pop"), s = ui.pop;
  p.innerHTML = { hora: popCard, card: popCard, tirar: popTirar, insp: popInsp, gm: popGm, add: popGm, motivo: popMotivo, posto: popPosto, secao: popSecao, novo: popNovo }[s.modo](s);
  p.hidden = false;
  const W = Math.min(s.modo === "posto" || s.modo === "secao" || s.modo === "novo" ? 440 : 380, innerWidth - 24);
  p.style.width = W + "px";
  posicionarPop();
  const foco = p.querySelector("#p-busca, #p-ini, #in-nome");
  if (foco && innerWidth >= 600) foco.focus();
  if (s.modo === "hora" || s.modo === "card") previaHora();
}
const cabPop = (t, sub) => `<div class="pop-cab"><div><b>${t}</b>${sub ? `<span class="meta">${sub}</span>` : ""}</div><button class="ic" data-act="pop-fechar" aria-label="Fechar">×</button></div>`;
function ehHeLancada(d) { return (d.nat === "he" || d.nat === "bh") && !d.fixa && !d.ajuste && d.origem !== "base"; }
function popGm(s) {
  let ini, fim, posto, titulo, sub, topo = "";

    topo = `<div class="presets">${[[fmtHm(t.ini), fmtHm(t.fim)], ...PRESETS[per].filter(([a, b]) => { const [x, y] = intervalo(a, b); return sobrepoe(x, y, t.ini, t.fim) > 0 && !(a === fmtHm(t.ini) && b === fmtHm(t.fim)); })]
      .map(([a, b]) => `<button class="opt ${a === s.ini && b === s.fim ? "on" : ""}" data-act="pop-add-hora" data-ini="${a}" data-fim="${b}">${a}–${b}</button>`).join("")}</div>`;
  }

  const linhaHe = (x, i) => `<li data-nome="${esc(norm(x.gm.nome))}" ${i >= 6 ? 'class="mais" hidden' : ""}><button class="pessoa" data-act="pop-escolher" data-gm="${x.gm.id}" data-via="he" ${x.bloqueado ? "disabled" : ""}>

    ${remanejar.length ? `<p class="grupo">Reserva técnica / à disposição</p><ul class="pessoas">${remanejar.map((x) => `<li data-nome="${esc(norm(x.gm.nome))}"><button class="pessoa" data-act="pop-escolher" data-gm="${x.gm.id}" data-via="rem" data-origem="${esc(x.origem.toLowerCase())}">
      <b>${esc(x.gm.nome)}</b><small>está na ${esc(x.origem.toLowerCase())}</small><span class="via rem">remanejar</span></button></li>`).join("")}</ul>` : ""}
    ${s.modo === "add" ? `<button class="link" data-act="pop-drawer">Mais opções (banco de horas, REQ…)</button>` : ""}</div>`;

// ---------- POSTOS, VIATURAS E SEÇÕES CLICÁVEIS ----------
const NOME_TURNO = { t2: "2º", t3: "3º", t4: "4º", t1: "1º" };
const stepper = (pref, vagas) => `<div class="steppers">${TURNOS.map((t) => `<div class="stp"><span>${NOME_TURNO[t.id]} turno</span><div class="stp-ctl">

  <button class="ic" data-act="step" data-alvo="${pref}-${t.id}" data-d="1" aria-label="Mais no ${NOME_TURNO[t.id]} turno">+</button></div></div>`).join("")}</div>`;
const lerStepper = (pref) => Object.fromEntries(TURNOS.map((t) => [t.id, Math.max(0, Math.min(9, Number($(`#${pref}-${t.id}`).value) || 0))]));
const ehViatura = (p) => p.tipo === "vtr" || p.tipo === "moto";
// ---------- VIATURAS (logística) ----------
// data.frota: [{ id, prefixo, modelo, situacao: "QAP" | "FA" | "FAP", finalidade, guarnicao }]
const SIT = { QAP: ["QAP", "qap"], FA: ["FA", "fa"], FAP: ["FA permanente", "fap"] };
const numeroDe = (txt) => (String(txt || "").match(/\b(\d{3,4})\b/) || [])[1] || "";
const viaturaNaFrota = (num) => num && (data.frota || []).find((v) => String(v.prefixo) === String(num));
// quem está na viatura hoje, pela escala (dia / noite)
function guarnicaoNaEscala(prefixo, cd) {
  const ps = data.postos.filter((p) => p.ativo !== false && numeroDe(nomeNoDia(p, cd)) === String(prefixo));
  const nomes = (per) => [...new Set(cd.designacoes.filter((d) => ps.some((p) => p.id === d.posto) && (per === "dia" ? d.ini % 1440 < 1140 && d.ini % 1440 >= 300 : !(d.ini % 1440 < 1140 && d.ini % 1440 >= 300))).map((d) => nomeGm(d.gm)))];
  const d = nomes("dia"), n = nomes("noite");
  return [d.length ? d.join("/") : "", n.length ? `noite: ${n.join("/")}` : ""].filter(Boolean).join(" · ");
}
function vFrota() {
  const fr = data.frota || [], f = (ui.frota ||= { sit: "", busca: "" }), cd = calcularDia(data, ui.dia);
  const conta = (k) => fr.filter((v) => v.situacao === k).length;
  const modelos = [...new Set(fr.map((v) => v.modelo || "SEM MODELO"))];
  const vis = (v) => (!f.sit || v.situacao === f.sit) && (!f.busca || norm(`${v.prefixo} ${v.modelo} ${v.finalidade} ${v.guarnicao}`).includes(norm(f.busca)));
  const linha = (v) => { const esc2 = guarnicaoNaEscala(v.prefixo, cd);
    return `<tr class="sit-${SIT[v.situacao]?.[1] || "qap"}"><td class="num pref"><input class="fr-in pref" data-fr="${v.id}" data-campo="prefixo" value="${esc(v.prefixo)}" size="5" aria-label="Prefixo"></td>
      <td class="sit">${Object.entries(SIT).map(([k, [t, c]]) => `<button class="sitb ${c} ${v.situacao === k ? "on" : ""}" data-act="fr-sit" data-fr="${v.id}" data-sit="${k}" aria-pressed="${v.situacao === k}" title="${t}">${k === "FAP" ? "FA perm." : k}</button>`).join("")}</td>
      <td><input class="fr-in" data-fr="${v.id}" data-campo="finalidade" value="${esc(v.finalidade || "")}" placeholder="${v.situacao === "FAP" ? "FA permanente" : "finalidade"}" aria-label="Finalidade"></td>
      <td><input class="fr-in" data-fr="${v.id}" data-campo="guarnicao" value="${esc(v.guarnicao || "")}" placeholder="${esc(esc2 || "guarnição")}" title="${esc2 ? `Na escala de ${ddmm(ui.dia)}: ${esc(esc2)}` : ""}" aria-label="Guarnição"></td>

  const cards = modelos.map((m) => { const vs = fr.filter((v) => (v.modelo || "SEM MODELO") === m), mostra = vs.filter(vis);
    if (!mostra.length && (f.sit || f.busca)) return "";
    return `<section class="fr-card"><header><span class="fr-qtd">${vs.length}</span><button class="link fr-modelo" data-act="fr-renomear" data-modelo="${esc(m)}" title="Renomear modelo">${esc(m)}</button>
        <span class="fr-mini">${["QAP", "FA", "FAP"].map((k) => vs.filter((v) => v.situacao === k).length ? `<i class="${SIT[k][1]}">${vs.filter((v) => v.situacao === k).length} ${k === "FAP" ? "FA perm." : k}</i>` : "").join("")}</span>
        <button class="btn mini" data-act="fr-add" data-modelo="${esc(m)}">+ viatura</button></header>

  return `<div class="barra"><div class="datas"><h2 class="titulo-mes">Viaturas</h2><span class="meta">situação atual da frota · guarnição sugerida pela escala de ${ddmm(ui.dia)}</span></div>
    <div class="filtros"><input type="search" id="fr-busca" value="${esc(f.busca)}" placeholder="Buscar prefixo, modelo, finalidade" aria-label="Buscar viatura"></div></div>
  <div class="resumo fr-resumo">
    ${[["", "Geral", fr.length, ""], ["QAP", "QAP", conta("QAP"), "qap"], ["FA", "FA", conta("FA"), "fa"], ["FAP", "FA permanente", conta("FAP"), "fap"]].map(([k, t, n, c]) => `<button class="kpi fr-kpi ${c} ${f.sit === k ? "on" : ""}" data-act="fr-filtro" data-sit="${k}"><span class="v">${n}</span><span class="l">${t}</span></button>`).join("")}

}
function popNovo(s) {

// ---------- MODO SERVIDOR (dados no banco da Cloudflare) ----------
// Sem servidor, tudo fica no navegador (localStorage). Com servidor, cada alteração vira um
// comando enviado com a revisão que a tela conhece; se outra pessoa salvou antes, recarrega.
const SERVIDOR = typeof window !== "undefined" ? window.ESCALA_SERVIDOR : null;
const DOCS_SYNC = ["postos", "secoes", "equipes", "config", "requerimentos", "inspetores", "frota", "folgasSync"];
const srv = { revisao: 0, foto: null, enviando: false, pendente: false, resumos: [], estado: "ok" };
function fotografar(d) {
  return {
    gms: new Map(d.gms.map((g) => [g.id, JSON.stringify(g)])),
    ocorrencias: new Map(d.ocorrencias.map((o) => [o.id, JSON.stringify(o)])),
    controle: new Map((d.controle || []).map((o) => [o.id, JSON.stringify(o)])),
    docs: Object.fromEntries(DOCS_SYNC.map((k) => [k, JSON.stringify(d[k] ?? null)])),
  };
}
function diferenca() {
  const ops = [], f = srv.foto;
  for (const c of ["gms", "ocorrencias", "controle"]) {
    const vistos = new Set();
    for (const x of data[c] || []) {
      vistos.add(x.id);
      const j = JSON.stringify(x);
      if (f[c].get(x.id) !== j) ops.push({ t: "put", c, id: x.id, v: x });
    }
    for (const id of f[c].keys()) if (!vistos.has(id)) ops.push({ t: "del", c, id });
  }
  for (const k of DOCS_SYNC) if (JSON.stringify(data[k] ?? null) !== f.docs[k]) ops.push({ t: "doc", k, v: data[k] ?? null });
  return ops;
}
function mostrarSync(estado) {
  srv.estado = estado;
  const el = $("#sync");
  if (!el) return;
  el.hidden = false;
  el.className = "sync " + estado;
  el.textContent = { ok: "✓ Salvo", salvando: "Salvando…", erro: "Sem conexão · tentando de novo" }[estado];
}
async function api(caminho, opcoes = {}) {
  const r = await fetch(caminho, { ...opcoes, headers: { "content-type": "application/json", ...(opcoes.headers || {}) } });
  if (r.status === 401) { location.href = "/login"; throw new Error("sessao"); }
  const corpo = await r.json().catch(() => ({}));
  return { status: r.status, corpo };
}
async function sincronizar() {
  if (srv.enviando) { srv.pendente = true; return; }
  const ops = diferenca();
  if (!ops.length) { mostrarSync("ok"); return; }
  srv.enviando = true; srv.pendente = false;
  mostrarSync("salvando");
  const resumo = srv.resumos.splice(0).join(" · ") || "Alteração";
  const cmd = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  try {
    let res;
    for (let tentativa = 0; tentativa < 3; tentativa++) {
      try { res = await api("/api/comandos", { method: "POST", body: JSON.stringify({ revisao: srv.revisao, cmd, resumo, ops }) }); break; }
      catch (e) { if (e.message === "sessao" || tentativa === 2) throw e; await new Promise((ok) => setTimeout(ok, 1500 * (tentativa + 1))); }
    }
    if (res.status === 409) {
      await carregarDoServidor();
      toast("A escala foi alterada em outro computador. Abri a versão mais nova: confira e refaça a sua última mudança, se precisar.");
    } else if (res.status !== 200) {
      throw new Error(res.corpo.erro || "erro");
    } else {
      srv.revisao = res.corpo.revisao;
      srv.foto = fotografar(data);
      mostrarSync("ok");
    }
  } catch (e) {
    if (e.message === "sessao") return;
    srv.resumos.unshift(resumo);
    mostrarSync("erro");
    setTimeout(() => { srv.enviando = false; sincronizar(); }, 4000);
    return;
  }
  srv.enviando = false;
  if (srv.pendente) sincronizar();
}
async function carregarDoServidor() {
  const { status, corpo } = await api("/api/estado");
  if (status !== 200) throw new Error(corpo.erro || "Falha ao carregar");
  srv.revisao = corpo.revisao;
  if (corpo.vazio) { ui.vazio = true; ui.pronto = true; render(); return; }
  data = { controle: [], ...corpo.estado, _versao: Date.now() };
  srv.foto = fotografar(data);
  desfazer.length = 0;
  ui.vazio = false; ui.pronto = true;
  mostrarSync("ok");
  render();
  conferirFolgas(false);
}

const arr = { ativo: false, d: null, el: null, x0: 0, y0: 0, fantasma: null, alvo: null, rolar: 0, raf: 0 };

function opcoesSoltar(d, alvo, copia = false) {
  const t = TURNOS.find((x) => x.id === alvo.turno), p = postoPorId(alvo.posto), pn = p.nome;
  const he = ehHeLancada(d), quem = nomeGm(d.gm);
  const noTurno = sobrepoe(d.ini, d.fim, t.ini, t.fim) > 0;
  const mesmoPosto = d.posto === alvo.posto;
  const it = [];
  const outro = alvo.des && alvo.des.gm !== d.gm ? alvo.des : null;
  if (he && copia) {
    // colar uma hora extra cria outra hora extra para a mesma pessoa no destino
    const ocupado = ocupadoEm(d.gm, t.ini, t.fim);
    it.push({ t: `Hora extra para ${quem} em ${pn} ${fmtHm(t.ini)}–${fmtHm(t.fim)} (${fmtHoras(t.fim - t.ini)})${ocupado ? " · já está trabalhando nesse horário" : ""}`, act: "dr-he", padrao: true, desab: ocupado });
  } else if (he) {
    // hora extra lançada: só muda de lugar/horário
    const [a, b] = noTurno ? [d.ini, d.fim] : [t.ini, t.fim];
    const ocupado = ocupadoEm(d.gm, a, b, d);
    if (!(mesmoPosto && noTurno)) it.push({ t: `Mover esta hora extra para ${pn} ${fmtHm(a)}–${fmtHm(b)}${ocupado ? " (já está trabalhando nesse horário)" : ""}`, act: "dr-mover-he", d: { ini: fmtHm(a), fim: fmtHm(b) }, padrao: true, desab: ocupado });
  } else {
    if (outro && noTurno && !mesmoPosto && !ehHeLancada(outro)) it.push({ t: `Trocar de lugar com ${nomeGm(outro.gm)}`, act: "dr-trocar-lugar", padrao: true });
    if (!mesmoPosto && noTurno) {
      it.push({ t: `Remanejar ${quem} para ${pn} (serviço inteiro, ${fmtHm(d.ini)}–${fmtHm(d.fim)})`, act: "dr-rem", padrao: !it.length });
      if (d.fim - d.ini > t.fim - t.ini) it.push({ t: `Remanejar só o ${t.nome.toLowerCase()} (${fmtHm(Math.max(d.ini, t.ini))}–${fmtHm(Math.min(d.fim, t.fim))})`, act: "dr-rem-parcial" });
    }
    if (!noTurno && copia) {
      const ocupado = ocupadoEm(d.gm, t.ini, t.fim, d);
      it.push({ t: `Hora extra para ${quem} em ${pn} ${fmtHm(t.ini)}–${fmtHm(t.fim)} (${fmtHoras(t.fim - t.ini)})${ocupado ? " · já está trabalhando nesse horário" : ""}`, act: "dr-he", padrao: true, desab: ocupado });
    } else if (!noTurno) {
      const [a0, b0] = (d.alvo || `${d.ini}-${d.fim}`).split("-").map(Number), dur = b0 - a0;
      const onde = mesmoPosto ? "" : ` em ${pn}`;
      const colado = t.ini === b0 || t.fim === a0;
      // 1) estender o serviço até o turno (as horas a mais são HE)
      if (colado && mesmoPosto) {
        const [ni, nf] = t.ini === b0 ? [a0, t.fim] : [t.ini, b0];
        it.push({ t: `Estender ${t.ini === b0 ? "até" : "desde"} ${fmtHm(t.ini === b0 ? t.fim : t.ini)} (+${fmtHoras(t.fim - t.ini)} de hora extra)`, act: "dr-hora", d: { ini: fmtHm(ni), fim: fmtHm(nf) }, padrao: true });
      }
      // 2) trabalhar em outro horário, mesma duração, sem hora extra (ex.: do 3º ao 4º turno)
      const deslocados = [[t.fim - dur, t.fim], [t.ini, t.ini + dur]].filter(([a, b], k, arr) => a !== a0 && arr.findIndex(([x]) => x === a) === k);

    const ajuste = (alvo, campos) => {
      const at = data.ocorrencias.find((o) => o.tipo === "HORARIO" && o.gm === quem && o.de === ui.dia && o.alvo === alvo);

    };
    const nFim = Math.min(b, h0);
    ajuste(alvoN, a === n0 && nFim === n1 ? null : { ini: fmtHm(a), fim: fmtHm(nFim) });
    ajuste(alvoH, b === h1 ? null : b > h0 ? { ini: fmtHm(h0), fim: fmtHm(b), semHE: true } : { ini: fmtHm(h0), fim: fmtHm(h1), remover: true });

  const extra = b - a - sobrepoe(a, b, a0, b0);

  mudar(`${TIPOS[m]} para ${nomeGm(T)}; ${nomeGm(X)} ${via === "rem" ? "remanejado" : "com hora extra"}`, () => {

      if (["HE", "BH_MAIS", "REMANEJ", "FA"].includes(t)) o.posto = v("#l-posto");
      if (t === "HE" || t === "BH_MAIS") { o.ini = v("#l-ini"); o.fim = v("#l-fim"); if (!o.ini || !o.fim) { toast("Informe início e fim."); break; } }
      if (t === "TROCA") { o.substituto = v("#l-sub"); if (o.substituto === o.gm) { toast("O substituto precisa ser outro GM."); break; } }
      if (!o.de) { toast("Informe a data."); break; }
      if (o.ate && o.ate < o.de) { toast("A data final é anterior à inicial."); break; }
      mudar(`${TIPOS[t]} lançado${o.gm ? " para " + nomeGm(o.gm) : ""}`, () => { data.ocorrencias.push(o); ui.form = { tipo: t }; ui.filtroLanc.mes = mesDe(o.de); });

document.addEventListener("change", (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === "pad-desde" && v) { ui.padrao.desde = v; ui.padrao.mes = mesDe(v); render(); return; }
  if (e.target.closest?.(".form-hf")) { previaHorarioFixo(); return; }
  if (e.target.dataset?.cgm) { salvarCelHoras(e.target); return; }

    if (ate < de) { toast("A data final não pode ser antes da inicial."); render(); return; }
    mudar(`${TIPOS[o.tipo]} de ${nomeGm(o.gm)}: ${ddmm(de)} a ${ddmm(ate)}`, () => { o.de = de; o.ate = ate; });
